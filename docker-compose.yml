services:
  traefik:
    image: traefik:v2.11.36
    restart: always
    ports:
      - "80:80"
      - "443:443"
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  redis:
    image: redis:7.4-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.6.4
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      N8N_HOST: "${DOMAIN_NAME}"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "https"
      N8N_SECURE_COOKIE: "true"
      N8N_PROXY_HOPS: "1"
      WEBHOOK_URL: "https://${DOMAIN_NAME}/"
      GENERIC_TIMEZONE: "${GENERIC_TIMEZONE}"
      NODE_ENV: "production"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      KB_GITHUB_TOKEN: "${KB_GITHUB_TOKEN}"
      N8N_PUBLIC_API_KEY: "${N8N_PUBLIC_API_KEY}"
      MEMORY_GITHUB_TOKEN: "${MEMORY_GITHUB_TOKEN}"
      MEMORY_CONNECTOR_GDRIVE_URL: "${MEMORY_CONNECTOR_GDRIVE_URL}"
      MEMORY_CONNECTOR_DROPBOX_URL: "${MEMORY_CONNECTOR_DROPBOX_URL}"
      MEMORY_CONNECTOR_S3_URL: "${MEMORY_CONNECTOR_S3_URL}"
      MEMORY_CONNECTOR_AUTH_TOKEN: "${MEMORY_CONNECTOR_AUTH_TOKEN}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=le"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "node -e \"const http=require('http');const req=http.get('http://127.0.0.1:5678',res=>process.exit(res.statusCode<500?0:1));req.on('error',()=>process.exit(1));\""
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files

volumes:
  traefik_data:
  redis_data:
  n8n_data:
