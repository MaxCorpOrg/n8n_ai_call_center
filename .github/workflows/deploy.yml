name: Deploy to Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
      DEPLOY_USER: aicore
      DEPLOY_SSH_KEY: ${{ secrets.SERVER_SSH_KEY || secrets.DEPLOY_SSH_KEY }}
      DEPLOY_TARGET: /home/aicore/n8n-server

    steps:
      - uses: actions/checkout@v4

      - name: Validate deploy settings
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "::error::Missing deploy host. Set secrets.SERVER_HOST or vars.SERVER_HOST."
            exit 1
          fi
          if [ -z "${DEPLOY_SSH_KEY}" ]; then
            echo "::error::Missing SSH key. Set secrets.SERVER_SSH_KEY (or secrets.DEPLOY_SSH_KEY)."
            exit 1
          fi

      - name: Prepare SSH key (native deploy)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # Supports both true multiline keys and one-line keys with literal \n.
          printf '%s' "${DEPLOY_SSH_KEY}" | perl -pe 's/\\n/\n/g' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
            echo "::error::SERVER_SSH_KEY is not a valid private key. Paste full private key including BEGIN/END lines."
            exit 1
          fi

          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Copy files to server
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${DEPLOY_TARGET}"
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            --exclude ".git/" \
            --exclude ".github/" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_TARGET}/"

      - name: SSH and deploy HTTPS stack
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" '
            set -e
            cd /home/aicore/n8n-server
            docker compose --env-file .env.https -f docker-compose.https.yml pull
            docker compose --env-file .env.https -f docker-compose.https.yml up -d --remove-orphans
            docker image prune -f
          '
