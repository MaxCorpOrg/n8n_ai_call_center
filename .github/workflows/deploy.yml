name: Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: aicore
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "."
          target: "/home/aicore/n8n-server"
          overwrite: true

      - name: SSH and deploy HTTPS stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: aicore
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /home/aicore/n8n-server
            docker compose --env-file .env.https -f docker-compose.https.yml pull
            docker compose --env-file .env.https -f docker-compose.https.yml up -d --remove-orphans
            docker image prune -f
