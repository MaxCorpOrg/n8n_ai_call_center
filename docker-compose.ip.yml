services:
  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: always
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: "147.45.213.87"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE}"
      WEBHOOK_URL: "http://147.45.213.87:5678/"
      GENERIC_TIMEZONE: "${GENERIC_TIMEZONE}"
      NODE_ENV: "production"
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: "${N8N_BASIC_AUTH_USER}"
      N8N_BASIC_AUTH_PASSWORD: "${N8N_BASIC_AUTH_PASSWORD}"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    depends_on:
      - redis

volumes:
  redis_data:
  n8n_data:
