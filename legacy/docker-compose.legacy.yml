services:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1) Traefik — обратный прокси для HTTPS, Basic Auth и маршрутизации
  traefik:
    image: traefik:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_data:/letsencrypt
      - ./legacy/traefik_dynamic.legacy.yml:/etc/traefik/traefik_dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--api=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/traefik_dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.mytlschallenge.acme.tlschallenge=true"
      - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"

  # ─────────────────────────────────────────────────────────────────────────────
  # 2) Redis — бекенд для Chat Memory (бесплатно, без OpenAI-ключей)
  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis_data:/data

  # ─────────────────────────────────────────────────────────────────────────────
  # 3) n8n — сервис автоматизации
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    labels:
      - "traefik.enable=true"
      # Telegram webhooks — без авторизации
      - "traefik.http.routers.n8n-webhook.rule=Host(`${DOMAIN_NAME}`) && PathPrefix(`/webhook`)"
      - "traefik.http.routers.n8n-webhook.entrypoints=web,websecure"
      - "traefik.http.routers.n8n-webhook.priority=100"
      - "traefik.http.routers.n8n-webhook.tls=true"
      - "traefik.http.routers.n8n-webhook.tls.certresolver=mytlschallenge"
      # Основной UI/API — с Basic Auth
      - "traefik.http.routers.n8n.rule=Host(`${DOMAIN_NAME}`) && !PathPrefix(`/webhook`)"
      - "traefik.http.routers.n8n.entrypoints=web,websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.n8n.middlewares=n8n-basic-auth@file"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    environment:
      - N8N_HOST=${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local-files:/files

volumes:
  traefik_data:
  redis_data:
  n8n_data:
